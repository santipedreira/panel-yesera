<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.github.com; img-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<title>Yeso proyectado · Tablero de socios</title>
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yesera">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
/* Lenguaje visual del tablero (tokens y piezas) */
:root{
  --brand-50:#f0fdfa;--brand-100:#ccfbf1;--brand-200:#99f6e4;--brand-300:#5eead4;--brand-400:#14b8a6;
  --brand-500:#0f766e;--brand-600:#115e59;--brand-700:#134e4a;
  --navy-900:#0b1120;--navy-800:#111a2e;
  --sidebar-ink:rgba(255,255,255,.78);--sidebar-ink-muted:rgba(255,255,255,.58);
  --sidebar-active:rgba(255,255,255,.10);--sidebar-hairline:rgba(255,255,255,.08);
  --ink-900:#1d1d1f;--ink-800:#2c2c2e;--ink-700:#3a3a3c;--ink-600:#545458;--ink-500:#6e6e73;
  --ink-400:#8e8e93;--ink-300:#d1d1d6;--ink-200:#e5e5ea;--ink-100:#f0f0f3;--ink-50:#fafafb;
  --surface:#f5f5f7;--canvas:#fff;--divider:#f2f2f5;
  --hoy:#c4141f;
  --warning-bg:#fff7e6;--warning-border:#f2d394;--warning-ink:#5c3a00;
  --ok-bg:#ecfdf5;--ok-ink:#047857;--curso-bg:#fffbeb;--curso-ink:#b45309;--mal-bg:#fef2f2;
  --gris-bg:var(--ink-100);--gris-ink:var(--ink-600);
  --p-1:#b45309;--p-2:#0369a1;
  --r-sm:6px;--r-md:8px;--r-tile:9px;--r-lg:12px;--r-xl:16px;--r-full:9999px;
  --sombra-1:0 1px 2px rgba(0,0,0,.10);--sombra-2:0 16px 48px -8px rgba(15,15,15,.16);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease-salida:cubic-bezier(.2,0,0,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--surface);color:var(--ink-900);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
a{color:var(--brand-500);text-decoration:none}a:hover{text-decoration:underline}
.num,time{font-variant-numeric:tabular-nums}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand-500);cursor:pointer}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
.page-title{font-size:32px;font-weight:700;line-height:1.1;letter-spacing:-.025em;margin:0}
.panel-title{font-size:16px;font-weight:600;margin:0}
.row-title{font-size:14.5px;font-weight:600;line-height:1.4}
.meta{font-size:13px;color:var(--ink-500);line-height:1.45}
.label{font-size:12px;font-weight:600;color:var(--ink-700);display:block;margin-bottom:4px}
.kpi-number{font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hoy-txt{color:var(--hoy)}
/* estructura */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex-shrink:0;background:var(--navy-900);color:var(--sidebar-ink);padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:none}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--brand-500);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:-.02em}
.brand b{display:block;color:#fff;font-size:15px;font-weight:600;line-height:1.2}
.brand small{display:block;color:var(--sidebar-ink-muted);font-size:12px}
.nav-group{color:var(--sidebar-ink-muted);font-size:12px;font-weight:600;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--r-md);color:var(--sidebar-ink);font-size:14px;font-weight:500;text-decoration:none;cursor:pointer;background:none;border:0;width:100%;font-family:inherit;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.05);text-decoration:none}
.nav-item.activo{background:var(--sidebar-active);color:#fff}
.nav-item .cuenta{margin-left:auto;color:var(--sidebar-ink-muted);font-size:12px;font-variant-numeric:tabular-nums}
.nav-item .cuenta-roja{margin-left:auto;background:var(--hoy);color:#fff;border-radius:var(--r-full);padding:0 6px;font-size:11px;font-weight:700;line-height:18px}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.firma{margin-top:auto;border-top:1px solid var(--sidebar-hairline);padding:12px 10px 0;color:var(--sidebar-ink-muted);font-size:12px;line-height:1.45}
.firma button{background:none;border:0;color:var(--sidebar-ink);font:inherit;font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
.main{flex:1;min-width:0;padding:32px 48px 48px;max-width:1760px}
.stack>*+*{margin-top:20px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:start}
@media(max-width:1100px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1024px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-2{grid-template-columns:1fr}}
@media(max-width:768px){.sidebar{display:none}.main{padding:20px 16px 32px}.page-title{font-size:28px}.cols{grid-template-columns:1fr}.solo-movil{display:flex!important}}
.solo-movil{display:none!important}
@media(max-width:768px){.solo-movil{display:flex!important}}
/* tarjetas */
.card{background:var(--canvas);border:1px solid var(--ink-200);border-radius:var(--r-lg)}
.tarjeta{background:var(--canvas);border-radius:var(--r-xl);overflow:hidden}
.card-header{height:56px;padding:0 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ink-100);font-size:17px;font-weight:600}
.card-body{padding:16px 20px}
.kpi{background:var(--canvas);border-radius:var(--r-xl);min-height:108px;padding:16px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;color:inherit;text-decoration:none;cursor:pointer;border:0;font-family:inherit;text-align:left;width:100%}
.kpi:hover{background:var(--ink-50);text-decoration:none}
.kpi-rotulo{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-500);line-height:1.25}
.kpi-icono{width:28px;height:28px;border-radius:var(--r-md);background:var(--ink-100);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink-600)}
.kpi-icono svg{width:15px;height:15px}
/* botones y campos */
.btn{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:var(--r-md);border:1px solid var(--ink-300);background:#fff;color:var(--ink-900);font:500 13px/1.3 var(--font);white-space:nowrap;cursor:pointer;user-select:none;transition:background-color 150ms var(--ease-salida),scale 150ms var(--ease-salida)}
.btn:hover{background:var(--ink-100)}
.btn:active:not(:disabled){scale:.97}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{border-color:var(--brand-500);background:var(--brand-500);color:#fff}
.btn-primary:hover{background:var(--brand-600)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-danger{color:#b91c1c}
.btn-danger:hover{background:#fef2f2;border-color:#fecaca}
.btn svg{width:16px;height:16px}
.input,.textarea,select.input{width:100%;border:1px solid var(--ink-300);border-radius:var(--r-md);background:#fff;padding:0 12px;font:400 14px var(--font);color:var(--ink-900);outline:none}
.input{height:36px}.textarea{padding:8px 12px;min-height:80px;resize:vertical}
.input:focus,.textarea:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-100)}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filtros .input{width:auto;min-width:150px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-700)}
/* pestañas (solo móvil) */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ink-200);overflow-x:auto;scrollbar-width:none}
.tab{height:38px;padding:0 12px;display:inline-flex;align-items:center;font:500 14px var(--font);color:var(--ink-500);background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab.activa{color:var(--ink-900);font-weight:600;border-bottom-color:var(--ink-900)}
/* pastillas */
.estado{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;white-space:nowrap}
.estado::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.estado.verde{background:var(--ok-bg);color:var(--ok-ink)}
.estado.ambar{background:var(--curso-bg);color:var(--curso-ink)}
.estado.rojo{background:var(--mal-bg);color:var(--hoy)}
.estado.gris{background:var(--gris-bg);color:var(--gris-ink)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 10px;border-radius:var(--r-full);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;background:var(--brand-500);color:#fff}
.count-badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 8px;border-radius:var(--r-full);background:var(--ink-100);color:var(--ink-700);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.aviso-costo{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--warning-border);border-radius:var(--r-md);background:var(--warning-bg);color:var(--warning-ink);font-size:13px}
/* personas */
.avatar{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:#fff;font-size:11px;font-weight:600;flex-shrink:0}
.avatar.sm{width:22px;height:22px;font-size:10.5px}
.avatar.s1{background:var(--p-1)}.avatar.s2{background:var(--p-2)}
.chip-persona{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 3px;border:1px solid var(--ink-200);border-radius:var(--r-full);background:#fff;font-size:13px;white-space:nowrap}
.dos{display:inline-flex}.dos .avatar+.avatar{margin-left:-6px;box-shadow:0 0 0 2px #fff}
/* listas y tablas */
.th{padding:8px 10px;text-align:left;font-size:12px;font-weight:600;color:var(--ink-500);white-space:nowrap}
.td{padding:10px;font-size:13px;color:var(--ink-900);vertical-align:middle;border-top:1px solid var(--divider)}
table{width:100%;border-collapse:collapse}
tbody tr{cursor:pointer}
tbody tr:hover .td{background:var(--ink-50)}
.list-row{display:grid;grid-template-columns:44px minmax(0,2fr) minmax(120px,.8fr) auto;gap:16px;align-items:center;padding:12px 20px;border-top:1px solid var(--divider);cursor:pointer}
.list-row:hover{background:var(--ink-50)}
.list-row.cab{cursor:default;padding-top:8px;padding-bottom:8px}.list-row.cab:hover{background:none}
.list-row:first-child{border-top:0}
@media(max-width:768px){.list-row{grid-template-columns:44px minmax(0,1fr) auto}.list-row .oculta-movil{display:none}}
.hoja{width:44px;height:48px;border-radius:var(--r-tile);background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.09);overflow:hidden;display:inline-flex;flex-direction:column;align-items:center;flex-shrink:0}
.hoja span:first-child{width:100%;height:15px;line-height:15px;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--ink-100);color:var(--ink-600)}
.hoja span:last-child{font-size:19px;font-weight:600;line-height:32px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hoja.hoy span:first-child{background:var(--hoy);color:#fff}
.hoja.sin span:last-child{font-size:14px;color:var(--ink-400)}
.etapas{display:grid;gap:3px;width:120px}
.etapas i{height:4px;border-radius:2px;background:#e8e8ed}
.etapas i.hecha{background:var(--brand-500)}.etapas i.actual{background:var(--brand-300)}
.recorrido{display:flex;flex-wrap:wrap;align-items:center;gap:8px;list-style:none;margin:0;padding:0;font-size:13.5px}
.recorrido li{display:flex;align-items:center;gap:8px;color:var(--ink-500)}
.recorrido li+li::before{content:"›";color:var(--ink-300)}
.paso{width:22px;height:22px;border-radius:50%;border:1px solid var(--ink-300);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.recorrido .hecho{color:var(--ink-900)}.recorrido .hecho .paso{background:var(--brand-500);border-color:var(--brand-500);color:#fff}
.recorrido .actual{color:var(--ink-900);font-weight:600}.recorrido .actual .paso{border:2px solid var(--brand-500);color:var(--brand-500)}
.barra{height:8px;border-radius:4px;background:var(--ink-100);overflow:hidden}
.barra>i{display:block;height:100%;background:var(--brand-500);transform-origin:left;animation:crecer 600ms var(--ease-salida) both}
/* tarjeta de tarea (tablero) */
.tk{background:#fff;border:1px solid var(--ink-200);border-radius:var(--r-lg);padding:12px 14px;cursor:pointer;margin-bottom:10px}
.tk:hover{background:var(--ink-50)}
.tk .row-title{margin-bottom:8px}
.tk .fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.col-h{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font-weight:600;font-size:14px}
/* tildar tareas y pasos */
.tilde{width:20px;height:20px;margin:0}
.list-row.con-tilde{grid-template-columns:20px 44px minmax(0,2fr) minmax(120px,.8fr) auto}
@media(max-width:768px){.list-row.con-tilde{grid-template-columns:20px 44px minmax(0,1fr) auto}}
.hecha .row-title{text-decoration:line-through;color:var(--ink-400)}
.tk-top{display:flex;gap:10px;align-items:flex-start}
.paso-row{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;padding:14px 20px;border-top:1px solid var(--divider)}
.paso-row .tilde{margin-top:1px}
.paso-row .fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.paso-row details{margin-top:6px}
.paso-row summary{cursor:pointer;color:var(--brand-500);font-size:13px;width:max-content}
.paso-row details p{margin:6px 0 0;max-width:760px}
/* ventana */
.velo{position:fixed;inset:0;background:rgba(11,17,32,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;z-index:20;animation:aparecer 160ms ease-out}
.ventana{background:#fff;border:1px solid var(--ink-200);border-radius:var(--r-xl);box-shadow:var(--sombra-2);max-width:640px;width:100%;animation:desplegar 160ms var(--ease-salida)}
.ventana header{height:56px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid var(--ink-100);font-size:17px;font-weight:600}
.ventana .cuerpo{padding:16px 20px}
.ventana footer{padding:12px 20px;border-top:1px solid var(--ink-100);display:flex;justify-content:space-between;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:10px 16px;border-radius:var(--r-md);display:none;z-index:30;font-size:13px}
.login{max-width:420px;margin:12vh auto 0;padding:0 16px}
.err{margin-top:12px;display:none}
@keyframes aparecer{from{opacity:0}}
@keyframes desplegar{from{opacity:0;transform:translateY(-4px) scale(.98)}}
@keyframes crecer{from{transform:scaleX(0)}}
@keyframes mostrar{from{opacity:0;transform:translateY(4px)}}
.mostrar{animation:mostrar 200ms var(--ease-salida)}
/* novedades, por decidir y números */
.nov-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 20px;border-top:1px solid var(--divider)}
.nov-row>.num{padding-top:1px;font-weight:600;color:var(--ink-700)}
.dec-row{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;padding:14px 20px;border-top:1px solid var(--divider)}
.dec-row .tilde{margin-top:1px}
.dec-row .fila,.nov-row .fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.enlace{background:none;border:0;padding:0;color:var(--brand-500);font:inherit;font-size:13px;cursor:pointer}
.enlace:hover{text-decoration:underline}
.mas{border-top:1px solid var(--divider)}
.mas summary{cursor:pointer;color:var(--brand-500);font-size:13px;padding:12px 20px}
.kpi.fijo{cursor:default;justify-content:flex-start}.kpi.fijo:hover{background:var(--canvas)}
@media(max-width:768px){.oculta-m{display:none}}
@media(min-width:769px){.que{min-width:220px}}
@media(prefers-reduced-motion:reduce){.mostrar,.barra>i,.ventana,.velo{animation:none}.btn:active:not(:disabled){scale:1}}
</style>
</head>
<body>

<!-- ENTRADA -->
<div id="login" class="login" style="display:none">
  <div class="card card-body stack" style="padding:24px">
    <div class="brand" style="padding:0"><span class="logo">YP</span><span><b style="color:var(--ink-900)">Yeso proyectado</b><small style="color:var(--ink-500)">Tablero de socios</small></span></div>
    <div class="meta">Pegá tu token de GitHub para entrar. Queda guardado solo en este navegador.</div>
    <div><label class="label" for="tok">Token de GitHub</label><input class="input" id="tok" type="password" placeholder="ghp_..."></div>
    <button class="btn btn-primary" id="enter" style="justify-content:center">Entrar</button>
    <div class="aviso-costo err" id="loginErr"></div>
    <div class="meta">¿No tenés token? Los pasos están en el README del repositorio de datos.</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand"><span class="logo">YP</span><span><b>Yeso proyectado</b><small>Tablero de socios</small></span></div>
    <button class="nav-item activo" data-v="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>Inicio<span class="cuenta-roja" id="navLate" style="display:none"></span></button>
    <div class="nav-group">Trabajo</div>
    <button class="nav-item" data-v="pasos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 6l2 2 3-3M4 13l2 2 3-3M4 20l2 2 3-3M12 7h8M12 14h8M12 21h8"/></svg>Paso a paso<span class="cuenta" id="navPasos"></span></button>
    <button class="nav-item" data-v="tablero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg>Tablero<span class="cuenta" id="navOpen"></span></button>
    <button class="nav-item" data-v="lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Lista</button>
    <button class="nav-item" data-v="calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
    <div class="nav-group">Estrategia</div>
    <button class="nav-item" data-v="fases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Fases y compuertas</button>
    <button class="nav-item" data-v="numeros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Números</button>
    <button class="nav-item" data-v="metas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Metas de contactos</button>
    <div class="nav-group">Empresa</div>
    <button class="nav-item" data-v="socios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-5-5.5"/></svg>Socios y roles</button>
    <button class="nav-item" data-v="documentos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>Documentos</button>
    <div class="firma"><span id="who"></span><br><button id="logout">Salir</button></div>
  </aside>

  <main class="main stack">
    <header style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
      <div><h1 class="page-title" id="titulo">Inicio</h1><div class="meta" style="margin-top:6px" id="sub"></div></div>
      <div style="display:flex;gap:8px"><button class="btn solo-movil" id="logoutM">Salir</button><button class="btn" id="reload">Actualizar</button><button class="btn btn-primary" id="newTask">+ Tarea</button></div>
    </header>

    <nav class="tabs solo-movil" id="tabsMovil">
      <button class="tab activa" data-v="inicio">Inicio</button><button class="tab" data-v="pasos">Paso a paso</button><button class="tab" data-v="tablero">Tablero</button><button class="tab" data-v="lista">Lista</button><button class="tab" data-v="calendario">Calendario</button><button class="tab" data-v="fases">Fases</button><button class="tab" data-v="numeros">Números</button><button class="tab" data-v="metas">Metas</button><button class="tab" data-v="socios">Socios</button><button class="tab" data-v="documentos">Documentos</button>
    </nav>

    <div class="filtros" id="filtros">
      <select class="input" id="fResp"></select>
      <select class="input" id="fFase"></select>
      <label class="check"><input type="checkbox" id="fGate"> Solo compuertas</label>
    </div>

    <div id="view" class="stack"></div>
  </main>
</div>

<!-- VENTANA DE TAREA -->
<div class="velo" id="mbg"><div class="ventana">
  <header id="mTitle">Tarea</header>
  <div class="cuerpo">
    <div class="field"><label class="label">Tarea</label><input class="input" id="mT"></div>
    <div class="row2">
      <div class="field"><label class="label">Responsable</label><select class="input" id="mR"></select></div>
      <div class="field"><label class="label">Estado</label><select class="input" id="mE"><option>Pendiente</option><option>En curso</option><option>Bloqueado</option><option>Hecho</option></select></div>
    </div>
    <div class="row2">
      <div class="field"><label class="label">Fecha límite</label><input class="input" id="mF" type="date"></div>
      <div class="field"><label class="label">Fase</label><select class="input" id="mP"></select></div>
    </div>
    <div class="field"><label class="check"><input type="checkbox" id="mC"> Hace falta para pasar la compuerta</label></div>
    <div class="field"><label class="label">Qué hay que subir</label><textarea class="textarea" id="mS"></textarea></div>
    <div class="field"><label class="label">Entregable (enlace a Drive, PDF, foto…)</label><input class="input" id="mU" placeholder="https://..."></div>
    <div class="field"><label class="label">Notas</label><textarea class="textarea" id="mN"></textarea></div>
  </div>
  <footer><button class="btn btn-danger" id="mDel">Borrar</button><span style="display:flex;gap:8px"><button class="btn" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">Guardar</button></span></footer>
</div></div>
<div class="toast" id="toast"></div>

<script>
// ====== CONFIGURACIÓN ======
const CFG = {
  owner: "santipedreira",
  repo: "empresa-yeso-proyectado",
  branch: "main",
  path: "tablero-datos/tablero.json",
  nombres: {}   // usuario de GitHub → nombre; lo normal es cargarlo en "usuarios" del archivo de datos
};
// ===========================

const API = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`;
const ESTADOS = ["Pendiente","En curso","Bloqueado","Hecho"];
const EST_CLS = {"Pendiente":"gris","En curso":"ambar","Bloqueado":"rojo","Hecho":"verde"};
const VISTAS = {inicio:"Inicio",pasos:"Paso a paso",tablero:"Tablero",lista:"Lista",calendario:"Calendario",fases:"Fases y compuertas",numeros:"Números",metas:"Metas de contactos",socios:"Socios y roles",documentos:"Documentos"};
const SIN_FILTROS = ["fases","numeros","metas","socios","documentos"];
const REPO_URL = `https://github.com/${CFG.owner}/${CFG.repo}/blob/${CFG.branch}/`;
const docUrl = p => REPO_URL + p.split("/").map(encodeURIComponent).join("/");
let TOKEN=null,DATA=null,SHA=null,USER=null,VIEW="inicio",EDIT=null;

const $=s=>document.querySelector(s);
const hoyISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmt=d=>d?esc(d).split("-").reverse().join("/"):"—";
const days=d=>Math.round((new Date(d+"T00:00:00")-new Date(hoyISO()+"T00:00:00"))/864e5);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const b64e=s=>{const b=new TextEncoder().encode(s);let r="";b.forEach(x=>r+=String.fromCharCode(x));return btoa(r)};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2600)}
const headers=()=>({"Authorization":`Bearer ${TOKEN}`,"Accept":"application/vnd.github+json"});
const sGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const sSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

async function load(){
  const r=await fetch(`${API}?ref=${CFG.branch}&t=${Date.now()}`,{headers:headers(),cache:"no-store"});
  if(r.status===401)throw new Error("El token no es válido o venció.");
  if(r.status===404)throw new Error("No encuentro el archivo de datos. ¿El token tiene acceso a este repositorio?");
  if(!r.ok)throw new Error("GitHub respondió "+r.status);
  const j=await r.json();SHA=j.sha;DATA=JSON.parse(b64d(j.content));
}
// Los guardados van en fila: dos tildes seguidos no pisan el sha del otro.
let COLA=Promise.resolve();
function save(msg){const r=COLA.then(()=>guardar(msg));COLA=r.catch(()=>{});return r}
async function guardar(msg){
  DATA.actualizado=hoyISO();
  const body={message:`Tablero: ${msg} (por ${USER})`,content:b64e(JSON.stringify(DATA,null,2)+"\n"),sha:SHA,branch:CFG.branch};
  let r;
  try{r=await fetch(API,{method:"PUT",headers:{...headers(),"Content-Type":"application/json"},body:JSON.stringify(body)})}
  catch(e){toast("Sin conexión: no se guardó");return false}
  if(r.status===409||r.status===422){toast("Alguien cambió algo recién. Recargando…");await load();render();return false}
  if(!r.ok){toast("No se pudo guardar ("+r.status+")");return false}
  SHA=(await r.json()).content.sha;toast("Guardado");return true;
}
async function start(){
  try{
    const u=await fetch("https://api.github.com/user",{headers:headers()});
    if(!u.ok)throw new Error("El token no es válido o venció.");
    USER=(await u.json()).login;
    await load();
    $("#login").style.display="none";$("#app").style.display="flex";
    setupFilters();render();
  }catch(e){
    $("#app").style.display="none";$("#login").style.display="block";
    const er=$("#loginErr");er.textContent=e.message;er.style.display="flex";
  }
}
const nombre=()=>(DATA&&DATA.usuarios||{})[USER]||CFG.nombres[USER]||USER;
const clave=n=>String(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function setupFilters(){
  const resp=[...new Set([...(DATA.socios||[]),"Los dos"])];
  $("#fResp").innerHTML=`<option value="">Todos los responsables</option>`+resp.map(r=>`<option>${esc(r)}</option>`).join("");
  $("#fFase").innerHTML=`<option value="">Todas las fases</option>`+DATA.fases.map(f=>`<option value="${f.id}">Fase ${f.id} · ${esc(f.nombre)}</option>`).join("");
  $("#mR").innerHTML=resp.map(r=>`<option>${esc(r)}</option>`).join("");
  $("#mP").innerHTML=DATA.fases.map(f=>`<option value="${f.id}">Fase ${f.id} · ${esc(f.nombre)}</option>`).join("");
  const s=sGet("yeso_resp");if(s!==null)$("#fResp").value=s;
}
function filtered(){
  const r=$("#fResp").value,f=$("#fFase").value,g=$("#fGate").checked;
  return DATA.tareas.filter(t=>(!r||t.responsable===r||t.responsable==="Los dos")&&(f===""||String(t.fase)===f)&&(!g||t.compuerta))
    .sort((a,b)=>(a.fecha||"9").localeCompare(b.fecha||"9"));
}

/* piezas */
function avatar(r,sm){
  const c=sm?" sm":"",S=DATA.socios||[];
  const una=(n,i)=>`<span class="avatar${c} s${i+1}">${esc(String(n).slice(0,2))}</span>`;
  const i=S.indexOf(r);
  if(i>=0)return una(r,i);
  return `<span class="dos">${S.map(una).join("")}</span>`;
}
const persona=r=>r==="Los dos"?`<span class="chip-persona" style="padding-left:3px">${avatar(r,true)}Los dos</span>`:`<span class="chip-persona">${avatar(r,true)}${esc(r)}</span>`;
function estadoDe(t){
  if(t.estado==="Hecho")return {cls:"verde",txt:"Hecho"};
  if(t.fecha&&days(t.fecha)<0&&t.estado!=="Bloqueado")return {cls:"rojo",txt:"Atrasada"};
  return {cls:EST_CLS[t.estado],txt:t.estado};
}
function hoja(f,done){
  if(!f)return `<span class="hoja sin"><span>—</span><span>s/f</span></span>`;
  const d=new Date(f+"T00:00:00"),h=!done&&days(f)===0;
  const dia=d.toLocaleDateString("es-UY",{weekday:"short"}).replace(".","");
  return `<span class="hoja${h?" hoy":""}"><span>${dia}</span><span>${d.getDate()}</span></span>`;
}
function dueMeta(t){
  if(t.estado==="Hecho"||!t.fecha)return "";
  const d=days(t.fecha);
  if(d<0)return `<span class="hoy-txt">Atrasada ${-d} d</span>`;
  if(d===0)return `<span class="hoy-txt">Vence hoy</span>`;
  if(d<=7)return `Vence en ${d} d`;
  return "";
}
const tilde=(kind,id,on,label)=>`<input type="checkbox" class="tilde" data-tilde="${kind}" data-ref="${esc(id)}"${on?" checked":""} aria-label="${esc(label)}" title="${on?"Destildar":kind==="d"?"Marcar como decidido":"Marcar como hecho"}">`;
const tildeT=t=>tilde("t",t.id,t.estado==="Hecho",(t.estado==="Hecho"?"Destildar: ":"Marcar hecha: ")+t.titulo);
const mil=v=>v==null||v===""?"—":(v<0?"−":"")+String(Math.round(Math.abs(v))).replace(/\B(?=(\d{3})+(?!\d))/g,".");
const sig=v=>v==null||v===""?"—":(v>0?"+":"")+mil(v);
const corta=d=>d?d.split("-").reverse().slice(0,2).join("/"):"";
const abrir=x=>x.vista&&VISTAS[x.vista]?`<button class="enlace" data-go="${esc(x.vista)}">Ver ${esc(VISTAS[x.vista])}</button>`:x.doc?`<a class="meta" href="${docUrl(x.doc)}" target="_blank" rel="noopener">Abrir ↗</a>`:"";
const para=f=>f?(dueMeta({estado:"",fecha:f})||`Para el ${fmt(f)}`):"";
function novRow(n){
  return `<div class="nov-row"><span class="meta num">${esc(corta(n.fecha))}</span><div><div class="row-title">${esc(n.titulo)}</div>
    ${n.texto?`<div class="meta">${esc(n.texto)}</div>`:""}${abrir(n)?`<div class="fila">${abrir(n)}</div>`:""}</div></div>`;
}
function decRow(x){
  const dm=x.hecho?(x.por?`Decidido por ${esc(x.por)} el ${fmt(x.el)}`:"Decidido"):para(x.para);
  return `<div class="dec-row${x.hecho?" hecha":""}">${tilde("d",x.id,x.hecho,(x.hecho?"Destildar: ":"Marcar decidido: ")+x.tema)}
    <div><div class="row-title">${esc(x.tema)}</div>${x.detalle?`<div class="meta">${esc(x.detalle)}</div>`:""}
    <div class="fila">${x.quien?persona(x.quien):""}${dm?`<span class="meta">${dm}</span>`:""}${abrir(x)}</div></div></div>`;
}
function pasoRow(p){
  const dm=p.hecho?(p.por?`Hecho por ${esc(p.por)} el ${fmt(p.el)}`:"Hecho"):dueMeta({estado:"",fecha:p.fecha});
  return `<div class="paso-row${p.hecho?" hecha":""}">${tilde("p",p.id,p.hecho,(p.hecho?"Destildar: ":"Marcar hecho: ")+p.titulo)}
    <div><div class="row-title">${esc(p.titulo)}</div>
    <div class="fila">${persona(p.responsable)}<span class="meta num">${fmt(p.fecha)}</span>${dm?`<span class="meta">${dm}</span>`:""}${p.ref?`<span class="count-badge">${esc(p.ref)}</span>`:""}${p.doc?`<a class="meta" href="${docUrl(p.doc)}" target="_blank" rel="noopener">Abrir ↗</a>`:""}</div>
    ${p.detalle?`<details><summary>Cómo</summary><p class="meta">${esc(p.detalle)}</p></details>`:""}</div></div>`;
}
function fila(t){
  const e=estadoDe(t),dm=dueMeta(t);
  return `<div class="list-row con-tilde${t.estado==="Hecho"?" hecha":""}" data-id="${esc(t.id)}">${tildeT(t)}${hoja(t.fecha,t.estado==="Hecho")}
    <div><div class="row-title">${t.compuerta?'<span class="pill" style="margin-right:6px">Compuerta</span>':""}${esc(t.titulo)}</div>
    <div class="meta">${[dm,`Fase ${t.fase}`,t.entregable?"Con entregable":""].filter(Boolean).join(" · ")}</div></div>
    <div class="oculta-movil">${persona(t.responsable)}</div>
    <span class="estado ${e.cls}">${e.txt}</span></div>`;
}
function tk(t){
  const e=estadoDe(t),dm=dueMeta(t);
  return `<div class="tk${t.estado==="Hecho"?" hecha":""}" data-id="${esc(t.id)}"><div class="tk-top">${tildeT(t)}<div class="row-title">${esc(t.titulo)}</div></div>
    <div class="fila">${avatar(t.responsable,true)}<span class="meta num">${fmt(t.fecha)}</span>${t.compuerta?'<span class="pill">Compuerta</span>':""}${e.txt==="Atrasada"?'<span class="estado rojo">Atrasada</span>':""}</div></div>`;
}
const ICON={
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></svg>',
  bars:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};

function render(){
  const cur=DATA.fases.find(f=>f.id===DATA.faseActual)||DATA.fases[0];
  const curT=DATA.tareas.filter(t=>t.fase===cur.id);
  const done=curT.filter(t=>t.estado==="Hecho").length;
  const gates=curT.filter(t=>t.compuerta),gDone=gates.filter(t=>t.estado==="Hecho").length;
  const open=DATA.tareas.filter(t=>t.estado!=="Hecho");
  const late=open.filter(t=>t.fecha&&days(t.fecha)<0),soon=open.filter(t=>t.fecha&&days(t.fecha)>=0&&days(t.fecha)<=7);
  const pct=curT.length?Math.round(done/curT.length*100):0;

  $("#titulo").textContent=VIEW==="inicio"?`Buen día, ${nombre()}`:VISTAS[VIEW];
  const hoyTxt=new Date().toLocaleDateString("es-UY",{weekday:"long",day:"numeric",month:"long"});
  $("#sub").innerHTML=VIEW==="inicio"?`${hoyTxt.charAt(0).toUpperCase()+hoyTxt.slice(1)} · Fase ${cur.id}: ${esc(cur.nombre)}`:`Datos actualizados el ${fmt(DATA.actualizado)}`;
  $("#who").textContent=`Entraste como ${nombre()}`;
  const nl=$("#navLate");nl.style.display=late.length?"":"none";nl.textContent=late.length;
  $("#navOpen").textContent=open.length;
  const rr=$("#fResp").value,PS=(DATA.pasos||[]).filter(p=>!rr||p.responsable===rr||p.responsable==="Los dos");
  const psHechos=PS.filter(p=>p.hecho).length;
  $("#navPasos").textContent=(DATA.pasos||[]).filter(p=>!p.hecho).length||"";
  document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle(b.classList.contains("tab")?"activa":"activo",b.dataset.v===VIEW));
  $("#filtros").style.display=SIN_FILTROS.includes(VIEW)?"none":"flex";
  $("#fFase").style.display=$("#fGate").parentElement.style.display=VIEW==="pasos"?"none":"";

  const L=filtered(),V=$("#view");
  let h="";
  if(VIEW==="inicio"){
    const prox=L.filter(t=>t.estado!=="Hecho").slice(0,6);
    const sig=PS.filter(p=>!p.hecho).slice(0,4);
    const NOV=[...(DATA.novedades||[])].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
    const DEC=[...(DATA.porDecidir||[])].sort((a,b)=>(a.hecho?1:0)-(b.hecho?1:0));
    const nov=NOV.length?`<section class="tarjeta"><header class="card-header">Novedades</header>${NOV.slice(0,3).map(novRow).join("")}
      ${NOV.length>3?`<details class="mas"><summary>Anteriores (${NOV.length-3})</summary>${NOV.slice(3).map(novRow).join("")}</details>`:""}</section>`:"";
    const dec=DEC.length?`<section class="tarjeta"><header class="card-header">Para decidir <span class="count-badge">${DEC.filter(x=>!x.hecho).length}</span></header>${DEC.map(decRow).join("")}</section>`:"";
    h=`<section class="grid-4">
      <button class="kpi" data-go="lista"><span class="kpi-rotulo"><span class="kpi-icono" style="color:var(--hoy)">${ICON.clock}</span>Atrasadas</span><span class="kpi-number ${late.length?"hoy-txt":""}">${late.length}</span></button>
      <button class="kpi" data-go="calendario"><span class="kpi-rotulo"><span class="kpi-icono">${ICON.list}</span>Vencen en 7 días</span><span class="kpi-number">${soon.length}</span></button>
      <button class="kpi" data-go="fases"><span class="kpi-rotulo"><span class="kpi-icono">${ICON.flag}</span>Compuertas de la fase</span><span class="kpi-number">${gDone}/${gates.length}</span></button>
      <button class="kpi" data-go="tablero"><span class="kpi-rotulo"><span class="kpi-icono">${ICON.bars}</span>Avance de la fase</span><span class="kpi-number">${pct}%</span></button>
    </section>
    ${nov||dec?`<div class="grid-2">${nov}${dec}</div>`:""}
    <section class="card"><div class="card-body stack">
      <ol class="recorrido">${DATA.fases.map(f=>`<li class="${f.id<cur.id?"hecho":f.id===cur.id?"actual":""}"><span class="paso">${f.id<cur.id?"✓":f.id}</span>${esc(f.nombre)}</li>`).join("")}</ol>
      <div><div class="meta" style="margin-bottom:6px">Compuerta de la fase ${cur.id}: ${esc(cur.compuerta)}</div><div class="barra"><i style="width:${gates.length?Math.round(gDone/gates.length*100):0}%"></i></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="prevF">Fase anterior</button><button class="btn" id="nextF">Pasar a la fase siguiente</button></div>
    </div></section>
    ${PS.length?`<section class="tarjeta"><header class="card-header">Siguientes pasos <span class="count-badge">${psHechos}/${PS.length}</span><button class="btn btn-ghost" data-go="pasos" style="margin-left:auto">Ver todos</button></header>
      ${sig.length?sig.map(pasoRow).join(""):'<div class="card-body meta">No quedan pasos sin tildar.</div>'}</section>`:""}
    <section class="tarjeta"><header class="card-header">Próximas tareas <span class="count-badge">${prox.length}</span></header>
      ${prox.length?prox.map(fila).join(""):'<div class="card-body meta">No hay tareas abiertas con estos filtros.</div>'}</section>`;
  } else if(VIEW==="pasos"){
    const ocultar=sGet("yeso_ocultar")==="1",pct=PS.length?Math.round(psHechos/PS.length*100):0;
    h=`<section class="card"><div class="card-body stack">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div class="row-title">${psHechos} de ${PS.length} pasos hechos</div><label class="check"><input type="checkbox" id="ocultar"${ocultar?" checked":""}> Ocultar lo hecho</label></div>
      <div class="barra"><i style="width:${pct}%"></i></div>
      <div class="meta">Tildá cada paso cuando esté hecho: se guarda en el repositorio y lo ve el otro socio. <a href="${docUrl("Fase 0/10 - Paso a paso.md")}" target="_blank" rel="noopener">Paso a paso completo</a></div></div></section>
    ${(DATA.etapas||[]).map(e=>{const all=PS.filter(p=>p.etapa===e.id);if(!all.length)return "";
      const vis=ocultar?all.filter(p=>!p.hecho):all,d=all.filter(p=>p.hecho).length;
      return `<section class="tarjeta"><header class="card-header">Etapa ${e.id} · ${esc(e.nombre)} <span class="count-badge">${d}/${all.length}</span></header>
        ${e.nota?`<div class="card-body meta" style="padding-bottom:4px">${esc(e.nota)}</div>`:""}
        ${vis.map(pasoRow).join("")||'<div class="card-body meta">Todo hecho en esta etapa.</div>'}</section>`}).join("")||'<div class="meta">No hay pasos cargados.</div>'}`;
  } else if(VIEW==="tablero"){
    h=`<div class="cols">${ESTADOS.map(e=>{const ts=L.filter(t=>t.estado===e);
      return `<div><div class="col-h"><span class="estado ${EST_CLS[e]}">${e}</span><span class="count-badge">${ts.length}</span></div>${ts.map(tk).join("")||'<div class="meta" style="padding:4px 2px">Sin tareas</div>'}</div>`}).join("")}</div>`;
  } else if(VIEW==="lista"){
    h=`<section class="tarjeta" style="overflow:auto"><table><thead><tr><th class="th" style="width:40px"><span class="meta" style="font-size:11px">Hecha</span></th><th class="th">Tarea</th><th class="th">Responsable</th><th class="th">Fecha</th><th class="th">Estado</th><th class="th">Qué hay que subir</th><th class="th">Entregable</th></tr></thead><tbody>${
      L.map(t=>{const e=estadoDe(t);return `<tr data-id="${esc(t.id)}"${t.estado==="Hecho"?' class="hecha"':""}><td class="td">${tildeT(t)}</td><td class="td"><div class="row-title">${esc(t.titulo)}</div><div class="meta">Fase ${t.fase}${t.compuerta?" · Compuerta":""}</div></td>
      <td class="td">${persona(t.responsable)}</td><td class="td num">${fmt(t.fecha)}</td><td class="td"><span class="estado ${e.cls}">${e.txt}</span></td>
      <td class="td meta" style="max-width:340px">${esc(t.subir)}</td><td class="td">${/^https?:\/\//i.test(t.entregable||"")?`<a href="${esc(t.entregable)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Abrir</a>`:'<span class="meta">—</span>'}</td></tr>`}).join("")
    }</tbody></table></section>`;
  } else if(VIEW==="calendario"){
    const by={};L.forEach(t=>{const k=(t.fecha||"sin fecha").slice(0,7);(by[k]=by[k]||[]).push(t)});
    h=Object.keys(by).sort().map(k=>{const label=k==="sin fecha"?"Sin fecha":new Date(k+"-01T00:00:00").toLocaleDateString("es-UY",{month:"long",year:"numeric"});
      return `<section class="tarjeta"><header class="card-header" style="text-transform:capitalize">${label} <span class="count-badge">${by[k].length}</span></header>${by[k].map(fila).join("")}</section>`}).join("")||'<div class="meta">Nada para mostrar.</div>';
  } else if(VIEW==="socios"){
    const R=DATA.roles||{};
    const rol=(n,cls)=>{const r=R[n]||{};return `<section class="card"><div class="card-body stack">
      <div style="display:flex;align-items:center;gap:10px">${avatar(n)}<div><h3 class="panel-title">${esc(n)} · ${esc(r.titulo||"")}</h3><div class="meta">${esc(r.frase||"")}</div></div></div>
      <div class="meta"><b style="color:var(--ink-700)">Dónde:</b> ${esc(r.donde||"—")} · <b style="color:var(--ink-700)">Cargo:</b> ${esc(r.cargo||"—")}</div>
      <ol style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.7">${(r.tareas||[]).map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div></section>`};
    h=`<div class="grid-2">${(DATA.socios||[]).map(n=>rol(n)).join("")}</div>
    <section class="tarjeta"><header class="card-header">Donde se cruzan: quién decide y quién ayuda</header><div style="overflow:auto"><table><thead><tr><th class="th">Tema</th><th class="th">Decide</th><th class="th">Ayuda</th></tr></thead><tbody>${(DATA.cruces||[]).map(c=>`<tr style="cursor:default"><td class="td">${esc(c.tema)}</td><td class="td"><b>${esc(c.decide)}</b></td><td class="td meta">${esc(c.ayuda)}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="tarjeta"><header class="card-header">Horas por semana según la etapa</header><div style="overflow:auto"><table><thead><tr><th class="th">Etapa</th>${(DATA.socios||[]).map(n=>`<th class="th">${esc(n)}</th>`).join("")}<th class="th">Por qué</th></tr></thead><tbody>${(DATA.dedicacion||[]).map(d=>`<tr style="cursor:default"><td class="td"><b>${esc(d.etapa)}</b></td>${(DATA.socios||[]).map(n=>`<td class="td">${esc(d[clave(n)])}</td>`).join("")}<td class="td meta">${esc(d.porque)}</td></tr>`).join("")}</tbody></table></div></section>
    <div class="grid-2"><section class="card"><div class="card-body stack"><h3 class="panel-title">Decide el responsable solo</h3><ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.7">${(DATA.decisiones?.solo||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></section>
    <section class="card"><div class="card-body stack"><h3 class="panel-title">Deciden los dos, por escrito</h3><ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.7">${(DATA.decisiones?.dos||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></section></div>
    <section class="card"><div class="card-body stack"><h3 class="panel-title">Acuerdo de socios: lo principal</h3><ul style="margin:0;padding-left:18px;font-size:13.5px;line-height:1.7">${(DATA.acuerdo||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><div><a href="${docUrl("Fase 0/01 - Acuerdo de socios (borrador).md")}" target="_blank" rel="noopener">Abrir el acuerdo completo</a></div></div></section>
    ${(DATA.reglas||[]).length?`<section class="card"><div class="card-body stack"><h3 class="panel-title">Reglas que no se negocian</h3>${DATA.reglas.map(x=>`<div class="aviso-costo">${esc(x)}</div>`).join("")}</div></section>`:""}`;
  } else if(VIEW==="metas"){
    const M=DATA.metas||[];
    h=`<section class="tarjeta"><header class="card-header">Embudos al ${fmt(DATA.metaFechas?.[0])} y al ${fmt(DATA.metaFechas?.[1])} <span class="count-badge">${M.length}</span></header>
    ${M.map((m,i)=>{const p=m.meta2?Math.min(100,Math.round((m.actual||0)/m.meta2*100)):0;const ok2=(m.actual||0)>=(m.meta2||0),ok1=m.meta1>0&&(m.actual||0)>=m.meta1;
      return `<div class="list-row" style="grid-template-columns:minmax(0,2fr) 90px minmax(120px,1fr) auto;cursor:default">
      <div><div class="row-title">${esc(m.nombre)}</div><div class="meta">${persona(m.responsable)}</div></div>
      <div><input class="input num" type="number" min="0" step="1" value="${m.actual||0}" data-meta="${i}" style="width:80px;text-align:center"></div>
      <div><div class="meta num" style="margin-bottom:4px">${m.actual||0} de ${m.meta2} al ${fmt(DATA.metaFechas?.[1])}${m.meta1?` · ${m.meta1} al ${fmt(DATA.metaFechas?.[0])}`:""}</div><div class="barra"><i style="width:${p}%"></i></div></div>
      ${ok2?'<span class="estado verde">Meta cumplida</span>':ok1?'<span class="estado verde">Meta 1 cumplida</span>':!m.meta1?'<span class="estado gris">Para febrero</span>':days(DATA.metaFechas?.[0]||"2099-01-01")<0?'<span class="estado rojo">Atrasada</span>':'<span class="estado ambar">En camino</span>'}</div>`}).join("")}
    <div class="card-body" style="display:flex;justify-content:flex-end"><button class="btn btn-primary" id="saveMetas">Guardar números</button></div></section>
    <section class="card"><div class="card-body meta">Se actualiza en la reunión semanal. Si al ${fmt(DATA.metaFechas?.[0])} hay menos de 3 entrevistas hechas, el problema son las horas, no el negocio. <a href="${docUrl("Fase 0/09 - Plan de contactos por persona.md")}" target="_blank" rel="noopener">Plan de contactos completo</a></div></section>`;
  } else if(VIEW==="numeros"){
    const N=DATA.numeros||{},B=N.base||{},C=N.corridas||[],G=[...new Set(C.map(c=>c.grupo||""))];
    const kf=(r,v,m)=>`<div class="kpi fijo"><span class="kpi-rotulo">${esc(r)}</span><span><span class="kpi-number">${esc(v)}</span>${m?`<div class="meta" style="margin-top:6px">${esc(m)}</div>`:""}</span></div>`;
    const dif=c=>{if(c.caja24==null||B.caja24==null)return "";const x=c.caja24-B.caja24;return `<span class="estado ${x>0?"verde":x<0?"rojo":"gris"}">${x>0?"+":""}${mil(x)}</span>`};
    const fc=c=>`<tr style="cursor:default"><td class="td meta num oculta-m">${esc(c.id||"")}</td><td class="td que"><div>${esc(c.que)}</div>${c.nota?`<div class="meta">${esc(c.nota)}</div>`:""}</td>
      <td class="td num oculta-m">${mil(c.resultado)}</td><td class="td num oculta-m">${mil(c.capital)}</td><td class="td num oculta-m">${c.recupera?esc(c.recupera):c.recupera===null?"No":"—"}</td>
      <td class="td num"><b>${sig(c.caja24)}</b></td><td class="td">${dif(c)}</td></tr>`;
    h=`<section class="grid-4">${kf("Resultado por mes",mil(B.resultado),"Promedio del año, antes del retiro y del impuesto")}${kf("Capital",mil(B.capital),B.iva?`Más ${mil(B.iva)} de IVA al contado`:"")}${kf("Recupera lo puesto",B.recupera?`Mes ${B.recupera}`:B.recupera===null?"No en 24 meses":"—","")}${kf("Caja al mes 24",sig(B.caja24),"Después del impuesto")}</section>
    <section class="card"><div class="card-body stack"><h3 class="panel-title">${esc(N.titulo||"El plan")}</h3>${N.supuestos?`<div class="meta">${esc(N.supuestos)}</div>`:""}
      <div class="meta">${N.confirmado?`Confirmado con el Excel el ${fmt(N.confirmado)}. `:""}${N.doc?`<a href="${docUrl(N.doc)}" target="_blank" rel="noopener">Plan completo</a>`:""}</div></div></section>
    ${G.map(g=>{const cs=C.filter(c=>(c.grupo||"")===g);return `<section class="tarjeta"><header class="card-header">${esc(g||"Corridas")} <span class="count-badge">${cs.length}</span></header>
      <div style="overflow:auto"><table><thead><tr><th class="th oculta-m"></th><th class="th">Qué cambia</th><th class="th oculta-m">Por mes</th><th class="th oculta-m">Capital</th><th class="th oculta-m">Recupera</th><th class="th">Caja al mes 24</th><th class="th">Contra el plan</th></tr></thead>
      <tbody>${cs.map(fc).join("")}</tbody></table></div></section>`}).join("")}
    ${(N.faltan||[]).length?`<section class="tarjeta"><header class="card-header">Lo que falta para afinar <span class="count-badge">${N.faltan.length}</span></header>
      ${N.faltan.map(f=>`<div class="dec-row" style="grid-template-columns:minmax(0,1fr)"><div><div class="row-title">${esc(f.que)}</div>${f.detalle?`<div class="meta">${esc(f.detalle)}</div>`:""}
      <div class="fila">${f.quien?persona(f.quien):""}${f.para?`<span class="meta">${para(f.para)}</span>`:""}</div></div></div>`).join("")}</section>`:""}`;
  } else if(VIEW==="documentos"){
    const G={};(DATA.documentos||[]).forEach(d=>{(G[d.grupo]=G[d.grupo]||[]).push(d)});
    h=Object.keys(G).map(g=>`<section class="tarjeta"><header class="card-header">${esc(g)} <span class="count-badge">${G[g].length}</span></header>
      ${G[g].map(d=>`<a class="list-row" style="grid-template-columns:28px minmax(0,1fr) auto;text-decoration:none;color:inherit" href="${docUrl(d.ruta)}" target="_blank" rel="noopener">
        <span class="kpi-icono">${ICON.list}</span><div><div class="row-title">${esc(d.nombre)}</div><div class="meta">${esc(d.desc||"")}</div></div><span class="meta">Abrir ↗</span></a>`).join("")}</section>`).join("")||'<div class="meta">Sin documentos cargados.</div>';
  } else {
    h=`<div class="grid-2">${DATA.fases.map(f=>{const ts=DATA.tareas.filter(t=>t.fase===f.id),d=ts.filter(t=>t.estado==="Hecho").length,p=ts.length?Math.round(d/ts.length*100):0;
      const est=f.id<DATA.faseActual?'<span class="estado verde">Cumplida</span>':f.id===DATA.faseActual?'<span class="estado ambar">En curso</span>':'<span class="estado gris">Por empezar</span>';
      return `<section class="card"><div class="card-body stack">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 class="panel-title">Fase ${f.id} · ${esc(f.nombre)}</h3>${est}</div>
        <div class="meta num">${fmt(f.desde)} → ${fmt(f.hasta)} · ${d}/${ts.length} tareas</div>
        <div class="barra"><i style="width:${p}%"></i></div>
        <div><span class="label">Compuerta</span><div class="meta">${esc(f.compuerta)}</div></div></div></section>`}).join("")}</div>
      <section class="card"><div class="card-body stack"><h3 class="panel-title">Cuándo frenar</h3>${(DATA.frenos||[]).map(x=>`<div class="aviso-costo">${esc(x)}</div>`).join("")}</div></section>`;
  }
  V.innerHTML=`<div class="mostrar stack">${h}</div>`;
  document.querySelectorAll("#view [data-id]").forEach(el=>el.onclick=()=>openModal(el.dataset.id));
  document.querySelectorAll("#view [data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
  document.querySelectorAll("#view .tilde").forEach(el=>{el.onclick=e=>e.stopPropagation();el.onchange=()=>tildar(el.dataset.tilde,el.dataset.ref,el.checked)});
  const oc=$("#ocultar");if(oc)oc.onchange=()=>{sSet("yeso_ocultar",oc.checked?"1":null);render()};
  const p=$("#prevF"),n=$("#nextF");if(p){p.onclick=()=>changePhase(-1);n.onclick=()=>changePhase(1)}
  const sm=$("#saveMetas");if(sm)sm.onclick=async()=>{
    const prev=JSON.stringify(DATA.metas);
    document.querySelectorAll("[data-meta]").forEach(el=>{const v=Math.max(0,Math.round(+el.value||0));DATA.metas[+el.dataset.meta].actual=v});
    if(JSON.stringify(DATA.metas)===prev){toast("No hay cambios");return}
    sm.disabled=true;if(!(await save("metas de contactos actualizadas")))DATA.metas=JSON.parse(prev);sm.disabled=false;render();
  };
}
function go(v){VIEW=v;render();window.scrollTo(0,0)}

// Tildar: se ve al instante y se guarda; si no se puede guardar, vuelve atrás.
async function tildar(kind,id,on){
  if(kind==="t"){
    const t=DATA.tareas.find(x=>x.id===id);if(!t)return;
    const prev=t.estado;t.estado=on?"Hecho":"Pendiente";render();
    if(!(await save(`"${t.titulo}" → ${t.estado}`))){t.estado=prev;render()}
  }else{
    const d=kind==="d",p=((d?DATA.porDecidir:DATA.pasos)||[]).find(x=>x.id===id);if(!p)return;
    const prev={hecho:p.hecho,por:p.por,el:p.el};
    p.hecho=on;if(on){p.por=nombre();p.el=hoyISO()}else{delete p.por;delete p.el}render();
    if(!(await save(`${d?"decisión":"paso"} "${d?p.tema:p.titulo}" ${on?(d?"tomada":"hecho"):"sin tildar"}`))){Object.assign(p,prev);if(prev.por===undefined){delete p.por;delete p.el}render()}
  }
}

async function changePhase(dir){
  const n=DATA.faseActual+dir;if(!DATA.fases.find(f=>f.id===n))return;
  if(dir>0){const pend=DATA.tareas.filter(t=>t.fase===DATA.faseActual&&t.compuerta&&t.estado!=="Hecho");
    if(pend.length&&!confirm(`Faltan ${pend.length} tareas de compuerta:\n- ${pend.map(t=>t.titulo).join("\n- ")}\n\n¿Pasar igual de fase?`))return}
  const prev=DATA.faseActual;DATA.faseActual=n;
  if(!(await save(`fase ${prev} → ${n}`)))DATA.faseActual=prev;
  render();
}

function openModal(id){
  EDIT=id?DATA.tareas.find(t=>t.id===id):null;
  const t=EDIT||{titulo:"",responsable:(DATA.socios||[]).includes(nombre())?nombre():(DATA.socios||["Los dos"])[0],estado:"Pendiente",fecha:hoyISO(),fase:DATA.faseActual,compuerta:false,subir:"",entregable:"",notas:""};
  $("#mTitle").textContent=EDIT?"Editar tarea":"Nueva tarea";
  $("#mT").value=t.titulo;$("#mR").value=t.responsable;$("#mE").value=t.estado;$("#mF").value=t.fecha||"";
  $("#mP").value=t.fase;$("#mC").checked=!!t.compuerta;$("#mS").value=t.subir||"";$("#mU").value=t.entregable||"";$("#mN").value=t.notas||"";
  $("#mDel").style.display=EDIT?"inline-flex":"none";$("#mbg").style.display="flex";
}
function closeModal(){$("#mbg").style.display="none";EDIT=null}

$("#mSave").onclick=async()=>{
  const v={titulo:$("#mT").value.trim(),responsable:$("#mR").value,estado:$("#mE").value,fecha:$("#mF").value,fase:+$("#mP").value,
    compuerta:$("#mC").checked,subir:$("#mS").value.trim(),entregable:$("#mU").value.trim(),notas:$("#mN").value.trim()};
  if(!v.titulo){toast("Ponele un nombre a la tarea");return}
  if(v.entregable&&!/^https?:\/\//i.test(v.entregable)){toast("El entregable tiene que ser un enlace https://");return}
  $("#mSave").disabled=true;
  if(EDIT){const before={...EDIT};Object.assign(EDIT,v);
    const msg=before.estado!==v.estado?`"${v.titulo}" → ${v.estado}`:`editó "${v.titulo}"`;
    if(!(await save(msg)))Object.assign(EDIT,before);
  }else{const t={id:"t"+Date.now().toString(36),...v};DATA.tareas.push(t);
    if(!(await save(`nueva tarea "${v.titulo}"`)))DATA.tareas.pop()}
  $("#mSave").disabled=false;closeModal();render();
};
$("#mDel").onclick=async()=>{
  if(!EDIT||!confirm(`¿Borrar "${EDIT.titulo}"? Queda en el historial de GitHub.`))return;
  const i=DATA.tareas.indexOf(EDIT),t=EDIT;DATA.tareas.splice(i,1);
  if(!(await save(`borró "${t.titulo}"`)))DATA.tareas.splice(i,0,t);
  closeModal();render();
};
$("#mCancel").onclick=closeModal;
$("#mbg").onclick=e=>{if(e.target.id==="mbg")closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
$("#newTask").onclick=()=>openModal(null);
$("#reload").onclick=async()=>{await load();render();toast("Actualizado")};
$("#logout").onclick=$("#logoutM").onclick=()=>{sSet("yeso_token",null);location.reload()};
document.addEventListener("click",e=>{const b=e.target.closest(".nav-item[data-v],.tab[data-v]");if(b)go(b.dataset.v)});
["#fResp","#fFase","#fGate"].forEach(s=>$(s).onchange=()=>{if(s==="#fResp")sSet("yeso_resp",$("#fResp").value);render()});
$("#enter").onclick=()=>{TOKEN=$("#tok").value.trim();if(!TOKEN)return;sSet("yeso_token",TOKEN);start()};
$("#tok").addEventListener("keydown",e=>{if(e.key==="Enter")$("#enter").click()});

TOKEN=sGet("yeso_token");
if(TOKEN)start();else $("#login").style.display="block";
</script>
</body>
